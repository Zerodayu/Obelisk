# NOTE: local-mode override — layered only by `just deploy-local`, later file wins per key
# NOTE: LOCAL_* names are *.localhost on loopback with Caddy's internal CA (no ACME)
# NOTE: local origins reach the frontend at build (ARGs) and backend/etl at runtime

services:
  caddy:
    environment:
      # NOTE: LOCAL_* flow from .env.docker through the dotenvx wrap in `just deploy-local`
      APP_DOMAIN: ${LOCAL_APP_DOMAIN:-}
      DOZZLE_DOMAIN: ${LOCAL_DOZZLE_DOMAIN:-}
      UMAMI_DOMAIN: ${LOCAL_UMAMI_DOMAIN:-}
      ADMIN_IPS: ${LOCAL_ADMIN_IPS:-}
      # NOTE: local mode swaps the public deny for the LOCAL_ADMIN_IPS allow-list
      CADDY_ADMIN_GUARD: /etc/caddy/guards/local.caddy

  frontend:
    build:
      args:
        # NOTE: ARG-only for these keys — public mode passes nothing, so build:prod reads .env.prod
        NEXT_PUBLIC_API_URL: ${LOCAL_API_URL:-}
        BETTER_AUTH_URL: ${LOCAL_FRONTEND_URL:-}
        FRONTEND_URL: ${LOCAL_FRONTEND_URL:-}
        # NOTE: local umami is a separate instance → its own hostname and website key
        NEXT_PUBLIC_UMAMI_DOMAIN: ${LOCAL_UMAMI_DOMAIN:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${LOCAL_UMAMI_WEBSITE_ID:-}
    environment:
      # NOTE: runtime `next start` reads .env.prod via dotenvx — compose-injected vars win
      BETTER_AUTH_URL: ${LOCAL_FRONTEND_URL:-}
      FRONTEND_URL: ${LOCAL_FRONTEND_URL:-}

  backend:
    environment:
      # NOTE: process.env beats the baked runtime-env snapshot (same mechanism as REDIS_HOST)
      BETTER_AUTH_URL: ${LOCAL_FRONTEND_URL:-}
      FRONTEND_URL: ${LOCAL_FRONTEND_URL:-}

  etl:
    environment:
      # NOTE: the ETL CORS check must allow the local origin
      OBELISK_ALLOWED_ORIGINS: ${LOCAL_FRONTEND_URL:-}
