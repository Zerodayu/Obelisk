# NOTE: whole self-hosted stack in one compose file (4 services), .env.prod-only —
# fill root .env.prod + `just env-encrypt` first; `just docker-up` builds and
# starts, `just docker-logs` tails (or lazydocker). Ports collide with `just dev`,
# and only backend/frontend face the network (etl/redis are loopback-only).
# TODO(prod): NEXT_PUBLIC_API_URL is baked from .env.prod at build — rebuild the
# frontend whenever that value changes.

# NOTE: json-file rotation so container logs can't fill the disk
x-logging: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      target: backend
      secrets:
        - envkeys
    image: obelisk-backend:latest
    container_name: obelisk-backend
    restart: unless-stopped
    logging: *log-rotation
    ports:
      - "8080:8080"
    environment:
      # NOTE: in-network addresses — .env.prod says "localhost", which inside a
      # container is the container itself; dotenvx won't touch these (it never
      # overrides an already-set var)
      REDIS_HOST: redis
      PYTHON_SERVER_URL: http://etl:8000
      # NOTE: BETTER_AUTH_URL / FRONTEND_URL stay browser-facing (localhost:3000)
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - redis
      - etl

  frontend:
    build:
      context: .
      target: frontend
      secrets:
        - envkeys
    image: obelisk-frontend:latest
    container_name: obelisk-frontend
    restart: unless-stopped
    logging: *log-rotation
    ports:
      - "3000:3000"
    # NOTE: API_INTERNAL_URL is baked as a build ARG and kept as an image ENV —
    # no runtime override; NEXT_PUBLIC_API_URL keeps its baked browser-facing value
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - backend

  etl:
    build:
      context: .
      target: etl
    image: obelisk-etl:latest
    container_name: obelisk-etl
    restart: unless-stopped
    logging: *log-rotation
    # NOTE: no auth by design — loopback only; the backend reaches http://etl:8000 over the compose network
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OBELISK_ENV: prod
      # NOTE: in-network overrides — the root .env.prod says "localhost"
      OBELISK_REDIS_HOST: redis
      OBELISK_REDIS_PORT: "6379"
    volumes:
      # NOTE: the service decrypts the root env file itself (app/core/env.py),
      # so the encrypted file + keys are mounted read-only like backend/frontend
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
      - uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: obelisk-redis
    restart: unless-stopped
    logging: *log-rotation
    # WARN: no password — loopback only (`just dev` still reaches it via localhost:6379)
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  uploads:

# NOTE: build-time decryption only — mounted per RUN, never baked into a layer
secrets:
  envkeys:
    file: .env.keys
