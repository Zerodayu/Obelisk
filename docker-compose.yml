# Obelisk — the whole self-hosted stack in one compose file (4 services),
# .env.prod-only: fill the root .env.prod + `just env-encrypt` first.
#
#   just docker-up        # `docker compose up -d --build` — build + start everything
#   just docker-logs      # tail everything; manage containers via lazydocker if preferred
#
# All four ports collide with `just dev` / `just start` — only one stack at a
# time. Only backend/frontend face the network; etl/redis bind loopback only
# (etl has no auth, redis has no password). The root .env.prod and .env.keys
# are bind-mounted read-only (the
# `start:prod` scripts decrypt them with dotenvx inside the container);
# `environment:` entries below are the in-network overrides dotenvx must not
# fight (it never overrides a var that is already set).
#
# TODO(prod): the frontend bakes NEXT_PUBLIC_API_URL from .env.prod at build
# time — rebuilding is mandatory whenever that value changes.

# NOTE: json-file rotation so container logs can't fill the disk
x-logging: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      target: backend
      secrets:
        - envkeys
    image: obelisk-backend:latest
    container_name: obelisk-backend
    restart: unless-stopped
    logging: *log-rotation
    ports:
      - "8080:8080"
    environment:
      # in-network addresses — everything in .env.prod says "localhost", which
      # inside a container is the container itself
      REDIS_HOST: redis
      PYTHON_SERVER_URL: http://etl:8000
      # BETTER_AUTH_URL / FRONTEND_URL stay browser-facing (localhost:3000)
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - redis
      - etl

  frontend:
    build:
      context: .
      target: frontend
      secrets:
        - envkeys
    image: obelisk-frontend:latest
    container_name: obelisk-frontend
    restart: unless-stopped
    logging: *log-rotation
    ports:
      - "3000:3000"
    # API_INTERNAL_URL (http://backend:8080) is baked as a build ARG and kept
    # as an image ENV — no runtime override needed here. NEXT_PUBLIC_API_URL
    # keeps its baked browser-facing value (localhost:8080 / your real origin).
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - backend

  etl:
    build:
      context: .
      target: etl
    image: obelisk-etl:latest
    container_name: obelisk-etl
    restart: unless-stopped
    logging: *log-rotation
    # NOTE: no auth by design — loopback only; the backend reaches http://etl:8000 over the compose network
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: apps/python-server/.env
        required: false
    environment:
      OBELISK_REDIS_HOST: redis
      OBELISK_REDIS_PORT: "6379"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: obelisk-redis
    restart: unless-stopped
    logging: *log-rotation
    # WARN: no password — loopback only (`just dev` still reaches it via localhost:6379)
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  uploads:

# Build-time decryption only: mounted per RUN, never baked into a layer.
secrets:
  envkeys:
    file: .env.keys
