# NOTE: whole stack (11 services), .env.prod-only — fill .env.prod + `just env-encrypt` first
# NOTE: only caddy publishes ports — stop `just dev` before deploying so host ports don't clash
# TODO(prod): NEXT_PUBLIC_API_URL / BETTER_AUTH_URL / FRONTEND_URL are baked — rebuild on change

services:
  # NOTE: only public entrypoint — TLS plus /api split, admin sites deny by default (see the Caddyfile)
  caddy:
    image: caddy:2-alpine
    container_name: obelisk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # NOTE: HTTP/3 — harmless to leave if the VPS firewall blocks UDP 443
      - "443:443/udp"
    environment:
      # NOTE: injected by the dotenvx wrap — env_file would pass the ciphertext through
      APP_DOMAIN: ${APP_DOMAIN:-}
      # NOTE: admin log-viewer hostname (see the DOZZLE_DOMAIN site block)
      DOZZLE_DOMAIN: ${DOZZLE_DOMAIN:-}
      # NOTE: analytics hostname (see the UMAMI_DOMAIN site block)
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-}
      # NOTE: guard file the admin site blocks import (local overlay swaps in local.caddy)
      CADDY_ADMIN_GUARD: /etc/caddy/guards/deny.caddy
    # NOTE: refuse to boot without the dotenvx wrap — see `just docker-logs` for the restart loop
    command: >
      sh -c 'test -n "$$APP_DOMAIN" || { echo "APP_DOMAIN not set - deploy via just docker-deploy" >&2; exit 1; };
      test -n "$$DOZZLE_DOMAIN" || { echo "DOZZLE_DOMAIN not set - deploy via just docker-deploy" >&2; exit 1; };
      test -n "$$UMAMI_DOMAIN" || { echo "UMAMI_DOMAIN not set - deploy via just docker-deploy" >&2; exit 1; };
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # NOTE: admin guard snippets (deny = public mode, local = deploy-local)
      - ./caddy/guards:/etc/caddy/guards:ro
      # NOTE: certs must survive recreates — re-issuing would burn Let's Encrypt rate limits
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - dozzle
      - umami
    networks:
      - edge

  backend:
    build:
      context: .
      target: backend
      secrets:
        - envkeys
    image: obelisk-backend:latest
    container_name: obelisk-backend
    restart: unless-stopped
    # NOTE: no published ports — in-network only (caddy /api over edge, etl/redis over internal)
    environment:
      # NOTE: in-network addresses — .env.prod's "localhost" means the container itself
      REDIS_HOST: redis
      PYTHON_SERVER_URL: http://etl:8000
      # NOTE: in-network Postgres — .env.prod's loopback URL would miss the db container
      # NOTE: compose-injected vars win (dotenvx never overrides a set var)
      DATABASE_URL: postgresql://obelisk:${OBELISK_DB_PASSWORD:-}@db:5432/obelisk
      DIRECT_URL: postgresql://obelisk:${OBELISK_DB_PASSWORD:-}@db:5432/obelisk
      # NOTE: BETTER_AUTH_URL / FRONTEND_URL stay browser-facing — the public https origin from .env.prod
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      redis:
        condition: service_started
      etl:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - edge
      - internal

  frontend:
    build:
      context: .
      target: frontend
      args:
        # NOTE: tracker origin + website key baked at build from .env.docker
        NEXT_PUBLIC_UMAMI_DOMAIN: ${UMAMI_DOMAIN:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      secrets:
        - envkeys
    image: obelisk-frontend:latest
    container_name: obelisk-frontend
    restart: unless-stopped
    # NOTE: no published ports — served by caddy over the edge network
    # NOTE: API_INTERNAL_URL is baked as ARG + ENV; the browser keeps the baked NEXT_PUBLIC_API_URL
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - backend
    networks:
      - edge

  etl:
    build:
      context: .
      target: etl
    image: obelisk-etl:latest
    container_name: obelisk-etl
    restart: unless-stopped
    # NOTE: no auth by design and no ports — backend reaches http://etl:8000 over the internal network
    environment:
      OBELISK_ENV: prod
      # NOTE: in-network overrides — the root .env.prod says "localhost"
      OBELISK_REDIS_HOST: redis
      OBELISK_REDIS_PORT: "6379"
    volumes:
      # NOTE: decrypts the root env file itself (app/core/env.py) — mounted read-only like backend
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
      - uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: obelisk-redis
    restart: unless-stopped
    # WARN: no password — loopback only (`just dev` still reaches it via localhost:6379)
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal

  # NOTE: app Postgres — loopback publish for host-side `just dev` / migrations / tests
  # NOTE: dev and tests use obelisk_dev, the deployed app serves obelisk
  # NOTE: schema via `just db-migrate` (dev) / `just docker-migrate` (containers)
  db:
    image: postgres:15-alpine
    container_name: obelisk-db
    restart: unless-stopped
    environment:
      # NOTE: password from .env.docker — must stay URL-safe for the backend's DATABASE_URL
      # WARN: empty = the postgres image refuses to init (fail fast)
      POSTGRES_DB: obelisk
      POSTGRES_USER: obelisk
      POSTGRES_PASSWORD: ${OBELISK_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obelisk -d obelisk"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # NOTE: loopback only — never expose Postgres beyond the host
      - "127.0.0.1:5432:5432"
    volumes:
      # NOTE: data must survive recreates — otherwise every deploy drops the DB
      - db-data:/var/lib/postgresql/data
    networks:
      - internal

  # NOTE: log viewer at DOZZLE_DOMAIN — no published port, public host answers 403 in the Caddyfile
  dozzle:
    image: amir20/dozzle:latest
    container_name: obelisk-dozzle
    restart: unless-stopped
    # WARN: docker.sock is root-equivalent — the :ro bind only freezes the file, keep actions/shell off
    # TODO(hardening): front the socket with tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # NOTE: /data keeps dozzle settings across recreates
      - dozzle-data:/data
    networks:
      - edge

  # NOTE: tailnet node serving the log viewer — no published port, WireGuard is the only ingress
  tailscale-dozzle:
    image: tailscale/tailscale:latest
    container_name: obelisk-tailscale-dozzle
    restart: unless-stopped
    # NOTE: shares dozzle's netns — userspace mode (image default), so no TUN or cap_add
    network_mode: "service:dozzle"
    depends_on:
      - dozzle
    environment:
      # NOTE: injected by the dotenvx wrap — reusable tag:obelisk key (admin console → Settings → Keys)
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # NOTE: MagicDNS name — obelisk-logs.<tailnet>.ts.net
      TS_HOSTNAME: obelisk-logs
      # NOTE: state must persist or every restart registers a new node
      TS_STATE_DIR: /var/lib/tailscale
      # NOTE: reuse the stored login instead of re-authing on every start
      TS_AUTH_ONCE: "true"
      # NOTE: ipn.ServeConfig — tailscaled terminates TLS and proxies to dozzle over loopback
      TS_SERVE_CONFIG: /config/dozzle.json
    volumes:
      # NOTE: mounted as a directory so config edits are re-applied
      - ./tailscale:/config:ro
      - ts-dozzle-state:/var/lib/tailscale

  # NOTE: analytics at UMAMI_DOMAIN — tracker paths public, dashboard moves to the tailnet name
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: obelisk-umami
    restart: unless-stopped
    # NOTE: umami's own init (signal handling / zombie reaping), as in upstream's compose
    init: true
    # NOTE: no published ports — only caddy reaches it over edge
    environment:
      # NOTE: injected by the dotenvx wrap — the postgres password rides inside the URL
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      # TODO: TWO_FACTOR_ENCRYPTION_KEY (`openssl rand -hex 32`) — without it 2FA setup answers 503
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      # NOTE: edge for caddy's proxy, internal to reach umami-db
      - edge
      - internal

  # NOTE: tailnet node serving the analytics dashboard — tracker stays on the public hostname
  tailscale-umami:
    image: tailscale/tailscale:latest
    container_name: obelisk-tailscale-umami
    restart: unless-stopped
    # NOTE: shares umami's netns — userspace mode (image default), so no TUN or cap_add
    network_mode: "service:umami"
    depends_on:
      - umami
    environment:
      # NOTE: injected by the dotenvx wrap — reusable tag:obelisk key (admin console → Settings → Keys)
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # NOTE: MagicDNS name — obelisk-stats.<tailnet>.ts.net
      TS_HOSTNAME: obelisk-stats
      # NOTE: state must persist or every restart registers a new node
      TS_STATE_DIR: /var/lib/tailscale
      # NOTE: reuse the stored login instead of re-authing on every start
      TS_AUTH_ONCE: "true"
      # NOTE: ipn.ServeConfig — tailscaled terminates TLS and proxies to umami over loopback
      TS_SERVE_CONFIG: /config/umami.json
    volumes:
      # NOTE: mounted as a directory so config edits are re-applied
      - ./tailscale:/config:ro
      - ts-umami-state:/var/lib/tailscale

  # NOTE: umami's datastore — in-network only, no published port
  umami-db:
    image: postgres:15-alpine
    container_name: obelisk-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # NOTE: events must survive recreates — data lives in postgres only
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  uploads:
  # NOTE: caddy certs survive recreates — otherwise every deploy burns Let's Encrypt rate limits
  caddy-data:
  caddy-config:
  # NOTE: dozzle settings (users/filters if auth is enabled later)
  dozzle-data:
  # NOTE: app data (Prisma/Postgres)
  db-data:
  # NOTE: umami analytics events (postgres)
  umami-db-data:
  # NOTE: tailscale node identity — losing it re-registers the node under a new name
  ts-dozzle-state:
  ts-umami-state:

networks:
  # NOTE: caddy + app tier — backend joins both, frontend only talks to backend
  edge:
  # NOTE: not `internal: true` — backend still needs egress for the Google OAuth token exchange
  internal:

# NOTE: build-time decryption only — mounted per RUN, never baked into a layer
secrets:
  envkeys:
    file: .env.keys
