# NOTE: whole self-hosted stack in one compose file (8 services), .env.prod-only —
# fill root .env.prod + `just env-encrypt` first; `just docker-deploy` builds and
# starts, `just docker-logs` tails (or lazydocker). Only caddy (80/443) is
# published — frontend/backend/etl/dozzle are compose-internal, redis keeps
# loopback so `just dev` can reach it; stop `just dev` before deploying so
# dev/prod don't mix.
# TODO(prod): NEXT_PUBLIC_API_URL / BETTER_AUTH_URL / FRONTEND_URL come from
# .env.prod and are baked at build — rebuild (docker-deploy does) when they change.

services:
  # NOTE: the only public entrypoint — terminates TLS (automatic Let's Encrypt,
  # HTTP-01 via :80) and splits traffic: /api/* → backend, everything else →
  # frontend; second site blocks serve dozzle at DOZZLE_DOMAIN and umami at
  # UMAMI_DOMAIN, both behind the ADMIN_IPS allow-list (see the Caddyfile).
  caddy:
    image: caddy:2-alpine
    container_name: obelisk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # NOTE: HTTP/3 — harmless to leave if the VPS firewall blocks UDP 443
      - "443:443/udp"
    environment:
      # NOTE: injected by the dotenvx wrap in `just docker-deploy` through compose
      # interpolation — env_file can't be used, it reads the file itself and
      # would pass the encrypted .env.docker values through verbatim
      APP_DOMAIN: ${APP_DOMAIN:-}
      # NOTE: admin log-viewer hostname (see the DOZZLE_DOMAIN site block)
      DOZZLE_DOMAIN: ${DOZZLE_DOMAIN:-}
      # NOTE: analytics hostname (see the UMAMI_DOMAIN site block)
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-}
      ADMIN_IPS: ${ADMIN_IPS:-}
    # NOTE: refuse to boot without the dotenvx wrap — an empty APP_DOMAIN would
    # otherwise start a hostless site with no certificate, and an empty
    # DOZZLE_DOMAIN/UMAMI_DOMAIN/ADMIN_IPS breaks the Caddyfile parse (restart
    # loop shows the message in `just docker-logs`)
    command: >
      sh -c 'test -n "$$APP_DOMAIN" || { echo "APP_DOMAIN not set - deploy via just docker-deploy" >&2; exit 1; };
      test -n "$$DOZZLE_DOMAIN" || { echo "DOZZLE_DOMAIN not set - deploy via just docker-deploy" >&2; exit 1; };
      test -n "$$UMAMI_DOMAIN" || { echo "UMAMI_DOMAIN not set - deploy via just docker-deploy" >&2; exit 1; };
      test -n "$$ADMIN_IPS" || { echo "ADMIN_IPS not set - deploy via just docker-deploy" >&2; exit 1; };
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # NOTE: certs/config must survive recreates — re-issuing on every deploy
      # would hit Let's Encrypt rate limits
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - dozzle
      - umami
    networks:
      - edge

  backend:
    build:
      context: .
      target: backend
      secrets:
        - envkeys
    image: obelisk-backend:latest
    container_name: obelisk-backend
    restart: unless-stopped
    # NOTE: no published ports — in-network only (caddy /api over edge, etl/redis over internal)
    environment:
      # NOTE: in-network addresses — .env.prod says "localhost", which inside a
      # container is the container itself; dotenvx won't touch these (it never
      # overrides an already-set var)
      REDIS_HOST: redis
      PYTHON_SERVER_URL: http://etl:8000
      # NOTE: BETTER_AUTH_URL / FRONTEND_URL stay browser-facing — the public
      # https://<APP_DOMAIN> origin from .env.prod (caddy terminates TLS)
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - redis
      - etl
    networks:
      - edge
      - internal

  frontend:
    build:
      context: .
      target: frontend
      args:
        # NOTE: the tracker origin is baked into the client bundle at build —
        # .env.prod only holds the website key (NEXT_PUBLIC_UMAMI_WEBSITE_ID)
        NEXT_PUBLIC_UMAMI_DOMAIN: ${UMAMI_DOMAIN:-}
      secrets:
        - envkeys
    image: obelisk-frontend:latest
    container_name: obelisk-frontend
    restart: unless-stopped
    # NOTE: no published ports — served by caddy over the edge network
    # NOTE: API_INTERNAL_URL is baked as a build ARG and kept as an image ENV —
    # no runtime override; NEXT_PUBLIC_API_URL keeps its baked browser-facing value
    volumes:
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
    depends_on:
      - backend
    networks:
      - edge

  etl:
    build:
      context: .
      target: etl
    image: obelisk-etl:latest
    container_name: obelisk-etl
    restart: unless-stopped
    # NOTE: no auth by design and no published ports — backend reaches
    # http://etl:8000 over the internal network only
    environment:
      OBELISK_ENV: prod
      # NOTE: in-network overrides — the root .env.prod says "localhost"
      OBELISK_REDIS_HOST: redis
      OBELISK_REDIS_PORT: "6379"
    volumes:
      # NOTE: the service decrypts the root env file itself (app/core/env.py),
      # so the encrypted file + keys are mounted read-only like backend/frontend
      - ./.env.prod:/app/.env.prod:ro
      - ./.env.keys:/app/.env.keys:ro
      - uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: obelisk-redis
    restart: unless-stopped
    # WARN: no password — loopback only (`just dev` still reaches it via localhost:6379)
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal

  # NOTE: container log viewer at https://<DOZZLE_DOMAIN> — private by design:
  # no published port, only caddy reaches it over edge, and the Caddyfile
  # answers every remote_ip outside ADMIN_IPS with 403 before proxying
  dozzle:
    image: amir20/dozzle:latest
    container_name: obelisk-dozzle
    restart: unless-stopped
    # WARN: docker.sock is root-equivalent on the host — the :ro bind only
    # freezes the file, the API still passes through; keep actions/shell off
    # TODO(hardening): front the socket with tecnativa/docker-socket-proxy if
    # dozzle ever needs to be reachable from a less trusted network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # NOTE: /data keeps dozzle settings across recreates
      - dozzle-data:/data
    networks:
      - edge

  # NOTE: self-hosted analytics at https://<UMAMI_DOMAIN> — the Caddyfile lets
  # the tracker endpoints (/script.js, /api/send) through for every visitor and
  # answers every other path with 403 unless the peer is in ADMIN_IPS
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: obelisk-umami
    restart: unless-stopped
    # NOTE: umami's own init (signal handling / zombie reaping), as in upstream's compose
    init: true
    # NOTE: no published ports — only caddy reaches it over edge
    environment:
      # NOTE: injected by the dotenvx wrap in `just docker-deploy` (like
      # ADMIN_IPS); the postgres password rides along inside the URL
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      # TODO: add TWO_FACTOR_ENCRYPTION_KEY (`openssl rand -hex 32`, re-encrypt
      # + redeploy) to unlock 2FA logins — without it 2FA setup answers 503
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      # NOTE: edge for caddy's proxy, internal to reach umami-db
      - edge
      - internal

  # NOTE: umami's datastore — in-network only, no published port; umami reaches
  # it over umami-db:5432 on the internal network
  umami-db:
    image: postgres:15-alpine
    container_name: obelisk-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # NOTE: events must survive recreates — data lives in postgres only
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  uploads:
  # NOTE: caddy certs/config survive recreates — otherwise every deploy
  # re-issues and burns Let's Encrypt rate limits
  caddy-data:
  caddy-config:
  # NOTE: dozzle settings (users/filters if auth is enabled later)
  dozzle-data:
  # NOTE: umami analytics events (postgres)
  umami-db-data:

networks:
  # NOTE: caddy + the app tier — backend joins both (caddy proxies /api to it,
  # and it must reach etl/redis); the frontend only ever talks to backend
  edge:
  # NOTE: named "internal" but NOT `internal: true` — backend still needs
  # egress from here (Google OAuth token exchange)
  internal:

# NOTE: build-time decryption only — mounted per RUN, never baked into a layer
secrets:
  envkeys:
    file: .env.keys
