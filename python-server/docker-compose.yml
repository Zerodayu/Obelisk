services:
  obelisk-etl:
    build: .
    image: obelisk-etl:latest
    container_name: obelisk-etl
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OBELISK_REDIS_HOST=redis
      - OBELISK_REDIS_PORT=6379
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    container_name: obelisk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  uploads:
